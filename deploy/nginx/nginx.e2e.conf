# AssetKu e2e reverse proxy (docker-compose.e2e.yml): the same routing as
# nginx.conf over plain HTTP (no certificate), published on localhost:8088.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 11m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_read_timeout 150s;
        }

        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
        }
    }
}
