# AssetKu production reverse proxy (docker-compose.yml, service nginx).
# One origin: /api/* goes to the Go API, everything else to Next.js, so the
# session and CSRF cookies stay first-party. TLS certificates come from certbot
# (see README): /etc/letsencrypt is mounted read-only, lineage name "assetku".

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65s;

    # Imports are capped at 10 MB by the API; leave room for the multipart envelope.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's DNS. Upstreams are resolved per request (variables below), so a
    # recreated api/web container with a new IP is picked up without a reload.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/assetku/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/assetku/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        # The API trusts X-Real-IP only from TRUSTED_PROXIES (the compose network);
        # the login rate limit is keyed on it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            # PDF exports and import uploads can take a while (API WriteTimeout is 120s).
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
        }

        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
        }
    }
}
